# Generated with ChatGPT
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip for uncompressed files
    gzip on;
    gzip_types text/css application/javascript font/woff2;

    # Cache static assets
    location ~* \.(css|js|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin API proxy (keeps the session cookie on one host/port)
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
    }

    # Fallback to index.html for SPA routing (if applicable)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
